<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="Logo Louagi">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C5D" />
      <stop offset="100%" stop-color="#145374" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#E0A300" />
    </linearGradient>
  </defs>
  <!-- Vehicle icon badge -->
  <g transform="translate(6, 6)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#primaryGrad)" />
    <!-- Louage Mini Van Shape -->
    <!-- Van Body (White) -->
    <path d="M10 32 L10 23 C10 20.5 12 18.5 14.5 18.5 L24 18.5 L31 22.5 L38 23.5 C39 23.7 40 24.6 40 26 L40 32 C40 32.5 39.5 33 39 33 L36.5 33 C36.5 31.5 35 30 33.5 30 C32 30 30.5 31.5 30.5 33 L19.5 33 C19.5 31.5 18 30 16.5 30 C15 30 13.5 31.5 13.5 33 L11 33 C10.5 33 10 32.5 10 32 Z" fill="#FFFFFF" />
    <!-- Iconic Tunisian Louage Yellow Stripe -->
    <path d="M10 25.5 L39.5 25.5 L39 28 L10 28 Z" fill="url(#yellowGrad)" />
    <!-- Windows -->
    <path d="M15 20.5 L23.5 20.5 L23.5 24 L15 24 Z" fill="#0B3C5D" opacity="0.85" />
    <path d="M25 20.5 L30 22.8 L29.5 24 L25 24 Z" fill="#0B3C5D" opacity="0.85" />
    <!-- Wheels -->
    <circle cx="16.5" cy="33" r="3" fill="#1F2933" />
    <circle cx="16.5" cy="33" r="1.3" fill="#E2E8F0" />
    <circle cx="33.5" cy="33" r="3" fill="#1F2933" />
    <circle cx="33.5" cy="33" r="1.3" fill="#E2E8F0" />
    <!-- Roof sign "Louage" -->
    <rect x="20" y="15.5" width="8" height="2.5" rx="1" fill="#F5B700" />
  </g>
  <!-- Text Brand -->
  <text x="64" y="38" font-family="'Poppins', 'Inter', sans-serif" font-weight="700" font-size="28" fill="#0B3C5D" letter-spacing="-0.5">
    Loua<tspan fill="#F5B700">gi</tspan>
  </text>
  <circle cx="178" cy="36" r="3" fill="#F5B700" />
</svg>
