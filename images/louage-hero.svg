<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="500" height="240" aria-label="Illustration d'un louage tunisien">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <linearGradient id="yellowBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#FFC933" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3C5D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#145374" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5B700" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#F5B700" stop-opacity="0" />
    </linearGradient>
    <filter id="carShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0B3C5D" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="230" cy="205" rx="190" ry="12" fill="#0B3C5D" opacity="0.12" />

  <g filter="url(#carShadow)">
    <!-- Roof Rack & Luggage -->
    <rect x="110" y="58" width="180" height="6" rx="3" fill="#64748B" />
    <rect x="125" y="64" width="6" height="8" fill="#475569" />
    <rect x="195" y="64" width="6" height="8" fill="#475569" />
    <rect x="265" y="64" width="6" height="8" fill="#475569" />
    
    <!-- Valise sur le toit 1 -->
    <rect x="135" y="44" width="55" height="15" rx="3" fill="#E05638" />
    <rect x="155" y="41" width="15" height="3" rx="1" fill="#882B17" />
    <!-- Valise sur le toit 2 -->
    <rect x="200" y="40" width="65" height="19" rx="4" fill="#0B3C5D" />
    <rect x="220" y="37" width="20" height="3" rx="1" fill="#F5B700" />
    
    <!-- Roof Lantern / Louage Sign -->
    <g transform="translate(280, 50)">
      <polygon points="5,0 45,0 40,16 10,16" fill="#F5B700" />
      <rect x="12" y="16" width="26" height="5" fill="#475569" />
      <text x="25" y="12" font-family="'Poppins', sans-serif" font-weight="700" font-size="7" fill="#0B3C5D" text-anchor="middle" letter-spacing="1">LOUAGE</text>
    </g>

    <!-- Main Van Body -->
    <path d="M 60 175 
             L 60 110 
             C 60 88, 78 72, 100 72 
             L 305 72 
             C 318 72, 335 78, 350 92 
             L 395 132 
             C 410 145, 418 155, 418 170 
             L 418 185 
             L 365 185 
             C 365 165, 335 165, 335 185 
             L 145 185 
             C 145 165, 115 165, 115 185 
             L 60 185 
             Z" 
          fill="url(#bodyGrad)" stroke="#CBD5E1" stroke-width="1.5" />

    <!-- Rear Bumper & Front Bumper -->
    <rect x="52" y="170" width="12" height="15" rx="4" fill="#334155" />
    <rect x="410" y="170" width="14" height="15" rx="4" fill="#334155" />

    <!-- Iconic Tunisian Louage Yellow Side Stripe -->
    <path d="M 60 135 L 416 135 L 417 150 L 60 150 Z" fill="url(#yellowBand)" />

    <!-- Windows Frame & Glass -->
    <!-- Rear side window -->
    <path d="M 75 88 L 135 88 C 137 88, 138 90, 138 92 L 138 124 C 138 126, 137 127, 135 127 L 75 127 C 72 127, 70 124, 70 120 L 70 93 C 70 90, 72 88, 75 88 Z" fill="url(#glassGrad)" />
    <!-- Middle side window -->
    <rect x="148" y="88" width="70" height="39" rx="3" fill="url(#glassGrad)" />
    <!-- Third side window -->
    <rect x="228" y="88" width="70" height="39" rx="3" fill="url(#glassGrad)" />
    <!-- Front windshield & front door window -->
    <path d="M 308 88 L 332 88 C 342 88, 353 93, 362 101 L 388 124 C 390 126, 388 127, 385 127 L 308 127 Z" fill="url(#glassGrad)" />
    <!-- Driver Silhouette -->
    <circle cx="342" cy="110" r="9" fill="#FFFFFF" opacity="0.4" />
    <path d="M 326 127 C 326 118, 335 116, 345 116 C 355 116, 362 119, 362 127 Z" fill="#FFFFFF" opacity="0.4" />

    <!-- Door Lines & Handles -->
    <line x1="143" y1="80" x2="143" y2="180" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="223" y1="80" x2="223" y2="180" stroke="#94A3B8" stroke-width="1.5" />
    <line x1="303" y1="80" x2="303" y2="180" stroke="#94A3B8" stroke-width="1.5" />
    
    <!-- Handles -->
    <rect x="150" y="140" width="14" height="4" rx="2" fill="#0B3C5D" />
    <rect x="230" y="140" width="14" height="4" rx="2" fill="#0B3C5D" />
    <rect x="310" y="140" width="14" height="4" rx="2" fill="#0B3C5D" />

    <!-- Front Headlight -->
    <path d="M 405 142 L 418 144 C 420 144, 421 146, 420 149 L 416 156 C 415 158, 413 159, 411 158 L 403 153 Z" fill="#F8FAFC" stroke="#E2E8F0" />
    <ellipse cx="414" cy="149" rx="3" ry="5" fill="#F5B700" />
    
    <!-- Light Beam projection -->
    <polygon points="418,145 490,125 490,195 418,160" fill="url(#lightBeam)" />

    <!-- Rear Light -->
    <rect x="58" y="138" width="4" height="18" rx="2" fill="#DC2626" />
    <rect x="58" y="144" width="4" height="6" fill="#F5B700" />

    <!-- Wheels Arch Backgrounds -->
    <path d="M 115 185 A 25 25 0 0 1 145 185 Z" fill="#1E293B" />
    <path d="M 335 185 A 25 25 0 0 1 365 185 Z" fill="#1E293B" />

    <!-- Back Wheel -->
    <g transform="translate(130, 185)">
      <circle cx="0" cy="0" r="24" fill="#1E293B" />
      <circle cx="0" cy="0" r="16" fill="#64748B" />
      <circle cx="0" cy="0" r="13" fill="#E2E8F0" />
      <!-- Spokes -->
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#0B3C5D" stroke-width="2.5" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#0B3C5D" stroke-width="2.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#0B3C5D" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#0B3C5D" stroke-width="2" />
      <circle cx="0" cy="0" r="4.5" fill="#F5B700" />
    </g>

    <!-- Front Wheel -->
    <g transform="translate(350, 185)">
      <circle cx="0" cy="0" r="24" fill="#1E293B" />
      <circle cx="0" cy="0" r="16" fill="#64748B" />
      <circle cx="0" cy="0" r="13" fill="#E2E8F0" />
      <!-- Spokes -->
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#0B3C5D" stroke-width="2.5" />
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#0B3C5D" stroke-width="2.5" />
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="#0B3C5D" stroke-width="2" />
      <line x1="-8" y1="8" x2="8" y2="-8" stroke="#0B3C5D" stroke-width="2" />
      <circle cx="0" cy="0" r="4.5" fill="#F5B700" />
    </g>

    <!-- License Plate (Tunisie) -->
    <rect x="382" y="174" width="26" height="9" rx="2" fill="#0B3C5D" />
    <text x="395" y="181" font-family="'Inter', sans-serif" font-weight="700" font-size="5" fill="#FFFFFF" text-anchor="middle">218 TN 789</text>
  </g>
</svg>
